name: showcase checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s examples/evidence-scoring -p 'test_*.py' -v
      - run: node --test examples/report-display/score-view.test.mjs
      - run: python3 scripts/check-showcase.py
