name: showcase checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 --version && node --version
      - run: python3 -m unittest discover -s examples/evidence-scoring -p 'test_*.py' -v
      - run: node --test examples/report-display/*.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/run-demo.py --check
      - run: python3 scripts/check-showcase.py
